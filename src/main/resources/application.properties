spring.application.name=notificaciones
# Puerto local 8086. En Docker, Compose entrega SERVER_PORT=8080.
server.port=${SERVER_PORT:8086}

# Base de datos propia del microservicio (notificaciones_db).
# createDatabaseIfNotExist crea la base automaticamente en MySQL local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notificaciones_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
